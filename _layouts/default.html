<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/logo/AOC-favicon.svg' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@400;500;600;700&family=Archivo:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('gate-locked');
      try {
        var theme = localStorage.getItem('aoc-theme');
        if (theme) root.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="gate" id="preview-gate">
    <div class="gate__panel">
      <div>
        <p class="eyebrow">Work in progress</p>
        <h1 class="heading-2">Anthony Orrach Creative</h1>
      </div>
      <form class="gate__form" id="preview-gate-form" autocomplete="off">
        <label class="visually-hidden" for="preview-gate-input">Password</label>
        <input class="gate__input" id="preview-gate-input" type="password" placeholder="Password" required>
        <button class="gate__submit" type="submit">Enter</button>
        <p class="gate__error" id="preview-gate-error" hidden>Wrong password — try again.</p>
      </form>
    </div>
  </div>
  <script src="{{ '/assets/js/gate.js' | relative_url }}"></script>

  {% include nav.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
