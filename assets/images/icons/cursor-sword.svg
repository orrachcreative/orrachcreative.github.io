<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Cursor sword for the closing CTA. Drawn twice: a dark stroke
       underneath so it stays visible on light grounds, the gold blade on
       top. Tip sits at 3,3 so it can be the hotspot. -->
  <g fill="none" stroke="#16110c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M3.5 3.5 L19 19"/>
    <path d="M13.4 20.6 L20.6 13.4"/>
    <path d="M19.6 19.6 L25.6 25.6"/>
  </g>
  <g fill="none" stroke="#E7C642" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 3.5 L19 19"/>
    <path d="M13.4 20.6 L20.6 13.4"/>
    <path d="M19.6 19.6 L25.6 25.6"/>
  </g>
</svg>
