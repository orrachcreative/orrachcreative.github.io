<header class="site-header">
  <a href="{{ '/' | relative_url }}" class="wordmark">
    <span class="wordmark__mark">AO</span>
    <span>
      <span class="wordmark__name">Anthony Orrach</span><br>
      <span class="wordmark__tag">Creative</span>
    </span>
  </a>

  <nav class="site-nav" aria-label="Primary">
    <div class="site-nav__links">
      <a href="{{ '/work/' | relative_url }}" class="nav-link{% if page.nav == 'work' %} is-active{% endif %}">Work</a>
      <a href="{{ '/projects/' | relative_url }}" class="nav-link{% if page.nav == 'projects' %} is-active{% endif %}">Projects</a>
      <a href="{{ '/about/' | relative_url }}" class="nav-link{% if page.nav == 'about' %} is-active{% endif %}">About</a>
    </div>
    <span class="nav-divider" aria-hidden="true"></span>
    <button class="theme-toggle" data-theme-toggle type="button" aria-pressed="false" aria-label="Toggle light and dark theme">
      {% include icon.html name="moon" %}
    </button>
    <button class="menu-toggle" data-menu-toggle type="button" aria-expanded="false" aria-controls="mobile-drawer" aria-label="Toggle menu">
      {% include icon.html name="menu" %}
    </button>
  </nav>
</header>

<div class="mobile-drawer" id="mobile-drawer" data-mobile-drawer>
  <a href="{{ '/work/' | relative_url }}" class="nav-link{% if page.nav == 'work' %} is-active{% endif %}">Work</a>
  <a href="{{ '/projects/' | relative_url }}" class="nav-link{% if page.nav == 'projects' %} is-active{% endif %}">Projects</a>
  <a href="{{ '/about/' | relative_url }}" class="nav-link{% if page.nav == 'about' %} is-active{% endif %}">About</a>
</div>
